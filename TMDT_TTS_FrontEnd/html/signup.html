<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>Create account | Exclusive</title><link rel="stylesheet" href="../css/signup.css"></head>
<body><div id="site-header"></div><main class="auth-layout"><div class="auth-photo"><span class="eyebrow">EXCLUSIVE · YOUR EVERYDAY EDIT</span><h2>Style<br>begins with<br>the little things.</h2></div><form id="signup-form" class="auth-form"><span class="eyebrow">START YOUR JOURNEY</span><h1>Create account</h1><p>Save your favorite pieces and track your orders.</p><label>Full name<input name="name" required maxlength="150" placeholder="Alex Morgan"></label><label>Email<input name="email" required type="email" placeholder="you@email.com"></label><label>Phone number <small>(optional)</small><input name="phone" placeholder="09xx xxx xxx"></label><label>Password<input name="password" required type="password" minlength="8" placeholder="At least 8 characters"></label><button class="button full">Create account <b>↗</b></button><p class="form-note" id="form-message"></p><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p></form></main><div id="site-footer"></div><script type="module" src="../java_script/signup.js"></script></body></html>
