<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>My account | Exclusive</title><link rel="stylesheet" href="../css/account.css"></head>
<body><div id="site-header"></div><main class="container page-space"><div class="crumb">Home <span>/</span> Account</div><div class="section-head"><div><span class="eyebrow">YOUR ACCOUNT</span><h1>My account</h1></div><button id="signout" class="text-button">Sign out</button></div><div class="account-layout"><nav class="account-nav"><a class="selected" href="#profile">Personal information</a><a href="#addresses">Address</a><a href="#orders">Order</a><a href="wishlist.html">Wishlist</a></nav><div class="account-content"><section id="profile" class="account-section"><span class="eyebrow">PROFILE</span><h2>Personal information</h2><form id="profile-form" class="field-grid"><label>Full name<input name="name" required></label><label>Email<input name="email" disabled></label><label>Phone number<input name="phone"></label><button class="button">Save changes</button></form><p id="profile-message" class="form-note"></p></section><section id="addresses" class="account-section"><span class="eyebrow">DELIVERY</span><h2>My addresses</h2><div id="address-list"></div><details class="address-form"><summary>＋ Add address</summary><form id="address-form" class="field-grid"><label>Recipient<input name="recipientName" required></label><label>Phone number<input name="phone" required></label><label class="wide">Address<input name="detail" required></label><label>Ward<input name="ward"></label><label>District<input name="district"></label><label>City<input name="city" required></label><label>Postal code<input name="postalCode"></label><label class="check-field"><input name="defaultAddress" type="checkbox"> Set as default</label><button class="button">Save address</button></form></details></section><section id="orders" class="account-section"><span class="eyebrow">ORDER HISTORY</span><h2>Recent orders</h2><div id="orders-list"></div></section></div></div></main><div id="site-footer"></div><script type="module" src="../java_script/account.js"></script></body></html>
