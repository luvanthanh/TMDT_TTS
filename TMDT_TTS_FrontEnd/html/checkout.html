<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>Checkout | Exclusive</title><link rel="stylesheet" href="../css/checkout.css"></head>
<body><div id="site-header"></div><main class="container page-space"><div class="crumb">Shopping bag <span>/</span> Checkout</div><div class="section-head"><div><span class="eyebrow">ALMOST THERE</span><h1>Checkout</h1></div><span class="secure-note">⌑ Secure checkout</span></div><div class="checkout-layout"><form id="checkout-form" class="checkout-form"><section class="form-section"><span class="step">01</span><div><h2>Shipping information</h2><p>Tell us where to deliver your order.</p></div><div class="field-grid"><label>Full name<input name="recipientName" required></label><label>Phone number<input name="phone" required></label><label class="wide">Address<input name="addressDetail" required placeholder="Street address"></label><label>Ward<input name="ward"></label><label>District<input name="district"></label><label>City<input name="city" required></label><label>Postal code<input name="postalCode"></label><label class="wide">Notes<input name="note" placeholder="Deliver after 5 PM..."></label></div></section><section class="form-section"><span class="step">02</span><div><h2>Payment method</h2><p>Choose your preferred payment method.</p></div><label class="radio-card"><input type="radio" name="paymentMethod" value="COD" checked><span><b>Cash on delivery</b><small>Pay the courier when your order arrives.</small></span><i>COD</i></label><label class="radio-card"><input type="radio" name="paymentMethod" value="VNPAY"><span><b>VNPay</b><small>Bank card, QR Pay, or digital wallet.</small></span><i>VNPAY</i></label></section><button class="button full">Place order <b>↗</b></button><p id="checkout-message" class="form-note"></p></form><aside id="checkout-summary" class="summary-card"><p>Loading your shopping bag…</p></aside></div></main><div id="site-footer"></div><script type="module" src="../java_script/checkout.js"></script></body></html>
