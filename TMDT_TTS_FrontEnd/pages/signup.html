<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Exclusive account - Your premier online shopping destination.">
    <meta property="og:title" content="Sign Up - Exclusive">
    <meta property="og:description" content="Create your Exclusive account.">
    <title>Sign Up - Exclusive</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-page="signup">
    <div id="site-header"></div>

    <main class="auth-container mt-60 mb-140">
        <div class="auth-image">
            <img src="../images/dl.beatsnoop 1.png" alt="Shopping cart and phone illustration" loading="lazy">
        </div>
        <div class="auth-form-wrap">
            <h2>Create an account</h2>
            <p>Enter your details below</p>

            <form class="auth-form" aria-label="Sign up form">
                <div class="form-group">
                    <label for="signup-name" class="sr-only">Name</label>
                    <input id="signup-name" type="text" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <label for="signup-email" class="sr-only">Email or Phone Number</label>
                    <input id="signup-email" type="text" placeholder="Email or Phone Number" required>
                </div>
                <div class="form-group">
                    <label for="signup-password" class="sr-only">Password</label>
                    <input id="signup-password" type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-primary auth-btn">Create Account</button>
                <button type="button" class="btn-outline auth-google-btn">
                    <img src="../images/google-logo.webp" alt="Google" width="24" height="24">
                    Sign up with Google
                </button>
            </form>

            <div class="auth-footer">
                Already have account? <a href="login.html">Log in</a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="../assets/global.js"></script>
    <script src="../assets/auth.js"></script>
</body>
</html>
