<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Exclusive</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/wishlist.css">
</head>
<body data-page="cart">
    <div id="site-header"></div>

    <main class="container mt-80 mb-140">
        <!-- WISHLIST TOP -->
        <div class="wishlist-header">
            <h2 id="wishlist-count">Wishlist (0)</h2>
            <button class="btn-outline">Move All To Bag</button>
        </div>

        <div class="wishlist-grid" id="wishlist-items-container"></div>

        <!-- JUST FOR YOU -->
        <div class="wishlist-header mt-80">
            <div class="section-title">
                <div class="red-block"></div>
                <h2>Just For You</h2>
            </div>
            <button class="btn-outline">See All</button>
        </div>

        <div class="wishlist-grid">
            <!-- JFY Item 1 -->
            <div class="product-card">
                <div class="product-img">
                    <div class="discount-badge">-35%</div>
                    <div class="action-icons">
                        <div class="icon"><i class="fa-regular fa-eye"></i></div>
                    </div>
                    <img src="../images/ideapad-gaming-3i-01-500x500 1.png" alt="Laptop">
                    <button class="add-to-cart-btn"><i class="fa-solid fa-cart-shopping"></i> Add To Cart</button>
                </div>
                <div class="product-info">
                    <h3 class="product-title">ASUS FHD Gaming Laptop</h3>
                    <div class="product-price">
                        <span class="current-price">$960</span>
                        <span class="old-price">$1160</span>
                    </div>
                    <div class="product-rating">
                        <div class="stars">
                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                        </div>
                        <span class="rating-count">(65)</span>
                    </div>
                </div>
            </div>

            <!-- JFY Item 2 -->
            <div class="product-card">
                <div class="product-img">
                    <div class="action-icons">
                        <div class="icon"><i class="fa-regular fa-eye"></i></div>
                    </div>
                    <img src="../images/g27cq4-500x500 1.png" alt="Monitor">
                    <button class="add-to-cart-btn"><i class="fa-solid fa-cart-shopping"></i> Add To Cart</button>
                </div>
                <div class="product-info">
                    <h3 class="product-title">IPS LCD Gaming Monitor</h3>
                    <div class="product-price">
                        <span class="current-price">$1160</span>
                    </div>
                    <div class="product-rating">
                        <div class="stars">
                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                        </div>
                        <span class="rating-count">(65)</span>
                    </div>
                </div>
            </div>

            <!-- JFY Item 3 -->
            <div class="product-card">
                <div class="product-img">
                    <div class="new-badge">NEW</div>
                    <div class="action-icons">
                        <div class="icon"><i class="fa-regular fa-eye"></i></div>
                    </div>
                    <img src="../images/havithvg92.png" alt="Gamepad">
                    <button class="add-to-cart-btn"><i class="fa-solid fa-cart-shopping"></i> Add To Cart</button>
                </div>
                <div class="product-info">
                    <h3 class="product-title">HAVIT HV-G92 Gamepad</h3>
                    <div class="product-price">
                        <span class="current-price">$560</span>
                    </div>
                    <div class="product-rating">
                        <div class="stars">
                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                        </div>
                        <span class="rating-count">(65)</span>
                    </div>
                </div>
            </div>

            <!-- JFY Item 4 -->
            <div class="product-card">
                <div class="product-img">
                    <div class="action-icons">
                        <div class="icon"><i class="fa-regular fa-eye"></i></div>
                    </div>
                    <img src="../images/ak-900-01-500x500 1.png" alt="Keyboard">
                    <button class="add-to-cart-btn"><i class="fa-solid fa-cart-shopping"></i> Add To Cart</button>
                </div>
                <div class="product-info">
                    <h3 class="product-title">AK-900 Wired Keyboard</h3>
                    <div class="product-price">
                        <span class="current-price">$200</span>
                    </div>
                    <div class="product-rating">
                        <div class="stars">
                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                        </div>
                        <span class="rating-count">(65)</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div id="site-footer"></div>
    <script src="../assets/global.js"></script>
    <script src="../assets/wishlist.js"></script>
</body>
