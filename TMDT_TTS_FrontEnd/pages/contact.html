<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Exclusive</title>
    <meta name="description" content="Get in touch with Exclusive. We are available 24/7 to help with your orders and questions.">
    <meta property="og:title" content="Contact - Exclusive">
    <meta property="og:description" content="Get in touch with Exclusive. We are available 24/7 to help with your orders and questions.">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body data-page="contact">
    <div id="site-header"></div>

    <main class="container mt-80 mb-140">
        <div class="breadcrumb">
            <a href="../index.html">Home</a> / <span>Contact</span>
        </div>

        <div class="contact-wrapper mt-80">
            <!-- Left Info Box -->
            <div class="contact-info" aria-label="Contact information">
                <!-- Call To Us -->
                <div class="info-section">
                    <div class="info-title">
                        <div class="icon-circle">
                            <i class="fa-solid fa-phone" aria-hidden="true"></i>
                        </div>
                        <h3>Call To Us</h3>
                    </div>
                    <p>We are available 24/7, 7 days a week.</p>
                    <p>Phone: +8801611112222</p>
                </div>
                
                <hr>
                
                <!-- Write To Us -->
                <div class="info-section">
                    <div class="info-title">
                        <div class="icon-circle">
                            <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        </div>
                        <h3>Write To US</h3>
                    </div>
                    <p>Fill out our form and we will contact you within 24 hours.</p>
                    <p>Emails: customer@exclusive.com</p>
                    <p>Emails: support@exclusive.com</p>
                </div>
            </div>

            <!-- Right Form Box -->
            <div class="contact-form-box">
                <form class="contact-form">
                    <div class="form-inputs">
                        <label for="contact-name" class="sr-only">Your Name</label>
                        <input type="text" id="contact-name" placeholder="Your Name *" required>
                        <label for="contact-email" class="sr-only">Your Email</label>
                        <input type="email" id="contact-email" placeholder="Your Email *" required>
                        <label for="contact-phone" class="sr-only">Your Phone</label>
                        <input type="tel" id="contact-phone" placeholder="Your Phone *" required>
                    </div>
                    
                    <label for="contact-message" class="sr-only">Your Message</label>
                    <textarea id="contact-message" placeholder="Your Message" required></textarea>
                    
                    <div class="form-action">
                        <button type="submit" class="btn-primary">Send Message</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="../assets/global.js"></script>
</body>
</html>
