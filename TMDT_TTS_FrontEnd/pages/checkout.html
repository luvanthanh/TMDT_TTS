<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Exclusive</title>
    <meta name="description" content="Complete your purchase at Exclusive checkout.">
    <meta property="og:title" content="Checkout - Exclusive">
    <meta property="og:description" content="Complete your purchase at Exclusive checkout.">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body data-page="checkout">

    <div id="site-header"></div>

    <main class="container mt-80 mb-140">
        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <a href="#">Account</a> / <a href="#">My Account</a> / <a href="#">Product</a> / <a href="cart.html">View Cart</a> / <span>CheckOut</span>
        </div>

        <div class="checkout-wrap">
            <!-- BILLING DETAILS -->
            <div class="billing-details">
                <h2 class="checkout-title">Billing Details</h2>
                
                <form class="billing-form">
                    <div class="form-group">
                        <label for="first-name">First Name<span class="required">*</span></label>
                        <input type="text" id="first-name" required>
                    </div>
                    <div class="form-group">
                        <label for="company-name">Company Name</label>
                        <input type="text" id="company-name">
                    </div>
                    <div class="form-group">
                        <label for="street-address">Street Address<span class="required">*</span></label>
                        <input type="text" id="street-address" required>
                    </div>
                    <div class="form-group">
                        <label for="apartment">Apartment, floor, etc. (optional)</label>
                        <input type="text" id="apartment">
                    </div>
                    <div class="form-group">
                        <label for="town-city">Town/City<span class="required">*</span></label>
                        <input type="text" id="town-city" required>
                    </div>
                    <div class="form-group">
                        <label for="phone-number">Phone Number<span class="required">*</span></label>
                        <input type="text" id="phone-number" required>
                    </div>
                    <div class="form-group">
                        <label for="email-address">Email Address<span class="required">*</span></label>
                        <input type="email" id="email-address" required>
                    </div>
                    <div class="form-checkbox">
                        <input type="checkbox" id="save-info" checked>
                        <label for="save-info">Save this information for faster check-out next time</label>
                    </div>
                </form>
            </div>

            <!-- ORDER SUMMARY -->
            <div class="order-summary" aria-label="Order summary">
                <div id="checkout-items-container"></div>

                <div class="order-totals">
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span id="checkout-subtotal-val">$0</span>
                    </div>
                    <div class="total-row">
                        <span>Shipping:</span>
                        <span>Free</span>
                    </div>
                    <div class="total-row total-final">
                        <span>Total:</span>
                        <span id="checkout-total-val">$0</span>
                    </div>
                </div>

                <div class="payment-methods" aria-label="Payment methods">
                    <div class="payment-option">
                        <div class="payment-radio">
                            <input type="radio" name="payment" id="bank">
                            <label for="bank">Bank</label>
                        </div>
                        <div class="payment-logos">
                            <img src="../images/visa.png" alt="Visa" loading="lazy">
                            <img src="../images/mastercard.png" alt="Mastercard" loading="lazy">
                            <img src="../images/indiabank.png" alt="India Bank" loading="lazy">
                            <img src="../images/bkash.png" alt="bKash" loading="lazy">
                        </div>
                    </div>
                    <div class="payment-option">
                        <div class="payment-radio">
                            <input type="radio" name="payment" id="cod" checked>
                            <label for="cod">Cash on delivery</label>
                        </div>
                    </div>
                </div>

                <div class="coupon-section-small">
                    <label for="coupon-code-checkout" class="sr-only">Coupon code</label>
                    <input type="text" id="coupon-code-checkout" placeholder="Coupon Code">
                    <button class="btn-primary">Apply Coupon</button>
                </div>

                <button class="btn-primary place-order-btn">Place Order</button>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="../assets/global.js"></script>
    <script src="../assets/checkout.js"></script>
</body>
</html>
