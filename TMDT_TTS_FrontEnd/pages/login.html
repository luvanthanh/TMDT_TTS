<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to Exclusive - Your premier online shopping destination.">
    <meta property="og:title" content="Log In - Exclusive">
    <meta property="og:description" content="Log in to Exclusive - Your premier online shopping destination.">
    <title>Log In - Exclusive</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-page="signup">
    <div id="site-header"></div>

    <main class="auth-container mt-60 mb-140">
        <div class="auth-image">
            <img src="../images/dl.beatsnoop 1.png" alt="Shopping cart and phone illustration" loading="lazy">
        </div>
        <div class="auth-form-wrap">
            <h2>Log in to Exclusive</h2>
            <p>Enter your details below</p>

            <form class="auth-form" aria-label="Login form">
                <div class="form-group">
                    <label for="login-email" class="sr-only">Email or Phone Number</label>
                    <input id="login-email" type="text" placeholder="Email or Phone Number" required>
                </div>
                <div class="form-group">
                    <label for="login-password" class="sr-only">Password</label>
                    <input id="login-password" type="password" placeholder="Password" required>
                </div>

                <div class="auth-login-actions">
                    <button type="submit" class="btn-primary auth-btn-login">Log In</button>
                    <a href="#" class="forget-password">Forget Password?</a>
                </div>
            </form>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="../assets/global.js"></script>
    <script src="../assets/auth.js"></script>
</body>
</html>
