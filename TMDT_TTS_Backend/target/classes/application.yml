spring:
  application:
    name: TMDT_TTS_Backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/TMDT_TTS}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
server:
  port: 8080
app:
  jwt:
    # Set APP_JWT_SECRET to a base64-encoded secret of at least 32 bytes before running.
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
